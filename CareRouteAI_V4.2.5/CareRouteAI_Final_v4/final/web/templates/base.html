<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1D3A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>{% block title %}CareRouteAI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Lucide icons via CDN (lightweight SVG icon lib) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">🏥</div>
      CareRoute<span class="brand-accent">AI</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
        <span>Patient</span>
      </a>
      <a href="/admin" class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
        <span>Admin</span>
      </a>
      <a href="/admin/analytics" class="nav-link {% if request.endpoint == 'admin_analytics' %}active{% endif %}">
        <span>Analytics</span>
      </a>
    </div>
  </nav>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="flash-container">
    {% for msg in messages %}
    <div class="flash-msg">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
