{% extends "base.html" %}
{% block title %}Admin Login — CareRouteAI{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div style="font-size:36px;margin-bottom:10px;">🔐</div>
    <h2 style="font-size:18px;font-weight:800;margin-bottom:4px;">Admin Login</h2>
    <p style="font-size:13px;color:var(--slate);margin-bottom:4px;">CareRouteAI · Clinic Management</p>
    <form method="POST">
      <input type="password" name="password" placeholder="Admin password" autofocus autocomplete="current-password" />
      <button type="submit" class="btn-primary" style="width:100%;padding:13px;margin-top:2px;">Login →</button>
    </form>
    <p style="margin-top:14px;font-size:12px;color:var(--slate-lt);">Set ADMIN_PASSWORD in your .env file</p>
  </div>
</div>
{% endblock %}
